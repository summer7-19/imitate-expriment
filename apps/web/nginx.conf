server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:3002;
        proxy_set_header Host $host;
    }

    location /files/ {
        proxy_pass http://server:3002;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
